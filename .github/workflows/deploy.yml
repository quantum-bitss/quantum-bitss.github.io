name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Set to "false" and push to master to restore the original website.
  SITE_PAUSED: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.SITE_PAUSED != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        if: env.SITE_PAUSED != 'true'
        run: npm install --legacy-peer-deps

      - name: Build
        if: env.SITE_PAUSED != 'true'
        run: npm run build

      - name: Build blank site while paused
        if: env.SITE_PAUSED == 'true'
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title></title></head><body></body></html>
          HTML
          cp out/index.html out/404.html

      # 避免 GitHub Pages 用 Jekyll 处理，忽略 _next 等目录
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Next.js output: 'export' 生成到 out 目录
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
